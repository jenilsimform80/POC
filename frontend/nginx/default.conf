server {
  listen 8080;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # API: same origin as the SPA. X-Forwarded-For is OVERWRITTEN (never appended) with the address nginx
  # saw, so the backend (TRUST_PROXY=1) can trust exactly this hop for login throttling.
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    client_max_body_size 200k;
    # The backend sets its own headers (helmet, Cache-Control: no-store) on API responses.
  }

  # Hashed build assets: cache for a year.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Never serve source maps.
  location ~* \.map$ {
    return 404;
  }

  # SPA: any other path serves index.html (client-side routing); never cached.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
